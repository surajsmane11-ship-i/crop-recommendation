name: Crop Recommendation CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: crop-recommendation
  ECR_REGISTRY: 117407498588.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-0a560ed3cbefa8b36

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build -t crop-recommendation:test .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::117407498588:role/GitHubActions-CropRecommendation
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 117407498588.dkr.ecr.ap-south-1.amazonaws.com",
              "sudo docker pull 117407498588.dkr.ecr.ap-south-1.amazonaws.com/crop-recommendation:latest",
              "sudo docker rm -f crop-app || true",
              "sudo docker run -d --name crop-app --restart unless-stopped -p 80:5000 117407498588.dkr.ecr.ap-south-1.amazonaws.com/crop-recommendation:latest",
              "sleep 5",
              "curl -f http://localhost/"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
