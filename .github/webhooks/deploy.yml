name: Crop Recommendation CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 068704209005.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: crop-recommendation-suraj
jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_number }}


  deploy-to-ec2:

    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "===== LOGIN TO ECR ====="

            aws ecr get-login-password \
              --region ap-south-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              066971257562.dkr.ecr.ap-south-1.amazonaws.com


            echo "===== PULL NEW IMAGE ====="

            docker pull \
              066971257562.dkr.ecr.ap-south-1.amazonaws.com/crop-recommendation:${{ github.run_number }}


            echo "===== REMOVE OLD CONTAINER ====="

            docker rm -f crop-app || true


            echo "===== START NEW CONTAINER ====="

            docker run -d \
              --name crop-app \
              -p 5000:5000 \
              066971257562.dkr.ecr.ap-south-1.amazonaws.com/crop-recommendation:${{ github.run_number }}


            echo "===== DEPLOYMENT COMPLETE ====="

            docker ps

            docker inspect crop-app \
              --format '{{.Config.Image}}'